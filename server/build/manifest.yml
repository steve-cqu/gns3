# GNS3 VM build manifest — single source of truth for node/template installation.
#
# Consumed by gns3build.py (the engine) and by the ansible/ wrapper that drives it.
# This file is the only place node/template mapping and image sources are defined.
#
# Projects: the curated list ../projects.txt is the source of truth, and it holds
# demonstration projects only. One appliance goes to staff and students alike; the templates
# students complete and the worked solutions are handed out through Moodle. So the VM must
# be able to run *every* activity, not just the few it ships — see the note on `platforms:`
# before removing any image.

# The gns3server the appliance is built on. Recorded in provenance next to the version the
# controller actually reports, so a mismatch is visible in the artefact rather than only in
# someone's memory. Bumped 2.2.54 -> 2.2.61 on 15 Aug 2026 with the rebuilt amd64 VM.
gns3_version: "2.2.61"

# Paths relative to this manifest file.
paths:
  templates_dir: ../templates      # templates/<name>.conf (each a GNS3 template JSON object)
  docker_dir: ../docker            # server/docker/<name>/ build contexts (local sources)
  symbols_dir: ../../images/symbols  # CQU node logos (*.svg) installed by the `logos` phase
  project_list: ../projects.txt    # names of the projects pre-imported into the appliance

# Absolute path on the GNS3 VM where Qemu disk images live.
qemu_images_dir: /opt/gns3/images/QEMU

# Where the `projects` phase looks for <Name>.gns3project, in order, searched
# recursively; first match wins. Override with --roots (e.g. when importing from the
# build host over --server instead of from the VM's own disk), in which case use
#   --roots <gns3-dev>/activities,<infiles>
# ORDER MATTERS: put the authoritative copy first. Do NOT include gns3-dev/outfiles —
# it is a generated-output dir holding stale exports that share their project_id with the
# rebuilt originals under activities/, so importing one shadows the other. The phase warns
# (DUP) whenever a name resolves under more than one root.
project_roots: [/home/gns3/projects]

# noVNC lets students reach VNC nodes (e.g. Firefox Host) from a browser — the GNS3 web UI
# draws consoles with xterm.js and has no VNC client, so this is the only way to open one.
#
# `service:` is the way students use it: one websockify, started at boot, serving every VNC
# console on this VM from one port. They open http://<gns3-vm-ip>:6080/ and click a node —
# no VM shell, no port numbers, nothing to redo after a reboot. Sources in server/novnc/,
# design and troubleshooting in server/README.md ("Reaching a VNC node").
#
# `script:` is the old manual bridge, kept as a staff fallback for a target the service will
# not resolve (a VNC port that is not a GNS3 node console). Give it a web port other than
# the service's, e.g. `./start-vnc.sh 5901 6081`, or it cannot bind.
novnc:
  packages: [novnc, python3-websockify, python3-numpy]
  script: ../start-vnc.sh          # installed to, and run from, the gns3 home dir
  install_to: ~/start-vnc.sh
  service:
    dir: ../novnc                       # sources: gns3_vnc_console.py, index.html, the unit
    unit: gns3-novnc.service            # -> /etc/systemd/system/
    port: 6080
    lib_dir: /usr/local/lib/gns3-novnc
    web_dir: /usr/local/share/gns3-novnc
    novnc_dir: /usr/share/novnc         # symlinked into web_dir as ./novnc

# GNS3 registry raw base (for docker nodes pulled from upstream).
#
# PINNED TO A COMMIT, deliberately — this was `refs/heads/master` until 14 August 2026, and an
# unpinned branch meant five images were built from whatever GNS3 had merged that day, with
# nothing in this repo changing. That is not hypothetical: it is how `openvswitch` acquired a
# non-executable init.sh between a passing July build and a failing August one, taking down
# stp-basics, vlan-basics and vlan-router. See gns3-dev/tools/tests/ovs-init-perms-fix.md.
#
# raw.githubusercontent.com serves a commit SHA in place of a branch name, so pinning costs
# nothing at build time. Every file fetched from here also carries a sha256 below, so a moved
# or truncated download fails loudly instead of producing a subtly different image.
#
# TO BUMP: change the SHA, re-run `gns3build.py docker --force --only <the five>`, refresh the
# sha256 values it reports as mismatched, and re-run the OVS activities (stp-basics,
# vlan-basics, vlan-router) before trusting it. Do not bump inside a term.
registry_base: https://raw.githubusercontent.com/GNS3/gns3-registry/eba400be9936ff5b0a3597bd84e5e3952e0aaa32

# Kernel modules the docker nodes need from the *host* kernel (containers share it).
# Loaded and persisted to /etc/modules-load.d/<mod>.conf by the `docker` phase.
#   wireguard  - wireguard-basics activity (alpinenode/vpnrouter)
#   sch_netem  - netem qdisc used by the NETem docker node
#   mac80211_hwsim - simulated 802.11 radios for the wireless nodes (cqugns3/wifinode). Loaded bare
#                    here (2 radios); the gns3-wifi-attach helper resizes the pool to the number of
#                    wireless nodes and moves a radio into each. From the base linux-modules package
#                    — linux-modules-extra is not needed.
#   cifs           - so a Linux Host can `mount -t cifs` a Samba share from the File Server node
#                    (smbclient needs no module; mounting does). From the base linux-modules package.
kernel_modules: [wireguard, sch_netem, mac80211_hwsim, cifs]

# Host kernel settings the Docker nodes need, applied and persisted by the same phase. A container
# shares the VM's kernel and cannot set these from inside its own namespace.
#
#   net.netfilter.nf_log_all_netns - let a firewall rule's `log` action actually produce output.
#     Netfilter's logging API is not namespace-aware, so the kernel SILENTLY DISCARDS log messages
#     from any network namespace but the initial one, to stop containers spamming the host log.
#     Every Docker router in this appliance is in its own namespace, so with the default 0 an
#     OpenWRT traffic rule with "Log this rule" ticked matches packets, moves its counter, and logs
#     nothing at all — with no error anywhere to explain it. Measured 18 August 2026 while building
#     openwrt-firewall-dmz.
#     NB the messages land in the VM HOST's kernel log, which the node can read with `dmesg` but
#     OpenWRT's own logd cannot, so they do not reach LuCI's Status -> System Log. The activity
#     documents that difference rather than papering over it.
sysctls:
  net.netfilter.nf_log_all_netns: 1

# Helper scripts the VM HOST needs (installed to /usr/local/bin by the `docker` phase, executable).
# A container cannot provide these from inside its own namespace.
#   gns3-wifi-attach - moves a mac80211_hwsim radio into each wireless node after the topology
#                      starts; the wireless activity's one host-side step. Paths are relative to
#                      this manifest file.
host_scripts:
  - {src: ../wifi/gns3-wifi-attach.sh, dst: /usr/local/bin/gns3-wifi-attach}

# Qemu hardware acceleration, written into gns3_server.conf's [Qemu] section by the `accel`
# phase. Read gns3server/compute/qemu/qemu_vm.py:_run_with_hardware_acceleration (2.2.54)
# before changing any of this — the defaults are a trap in two separate ways.
#
# Both `enable_hardware_acceleration` and `require_hardware_acceleration` default to TRUE, and
# "require" means *raise*, not *fall back*. So on a host with no nested virtualisation — a
# managed Windows laptop where Credential Guard forces Hyper-V to hold VT-x, and possibly some
# lab machines — every Qemu node dies with "KVM acceleration cannot be used (/dev/kvm doesn't
# exist)". Docker nodes are unaffected; they share the host kernel.
#
# Worse on arm64: the acceleration check runs BEFORE the architecture check and its
# supported_binaries list is x86-only, so qemu-system-aarch64 raises "Hardware acceleration can
# only be used with the following Qemu executables" on a Mac appliance whatever the hardware.
# The arm64 Qemu nodes only ever booted because enable_kvm=false had been set by hand while
# debugging something else.
#
# `require_kvm: false` fixes both: acceleration is still used wherever it exists, and the
# absent case returns False instead of raising. Do NOT reach for `enable_kvm: false` — the
# legacy names take priority over the new ones on Linux, so that disables acceleration
# outright and costs every capable machine the speed (OPNsense boots in ~20 s with KVM and
# minutes without).
#
# gns3server watches its config files (FileWatcher, mtime, 1 s) and live-reloads, so this needs
# no service restart — the build still never restarts GNS3. The watch is only established for
# files that existed at startup, which this one always does.
#
# `config_file` is a FALLBACK, not the answer. The phase discovers the file from the running
# gns3server's `--config` (then from gns3.service's ExecStart) and only falls back to this path
# when neither names one. That is not tidiness: the GNS3 VM moved the file between 2.2.54 and
# 2.2.61, an explicit --config makes it the *only* file loaded, and a phase writing to the old
# path reported success while changing nothing at all — leaving require_kvm unset on an
# appliance whose whole reason for this section is that it must be set.
qemu_accel:
  config_file: ~/.config/GNS3/2.2/gns3_server.conf
  section: Qemu
  settings:
    require_kvm: false

# Ubuntu's own update machinery, masked by the `quiesce` phase. An appliance is a frozen
# artifact: what it contains is decided by this manifest and recorded by `provenance`, not by
# whatever the archive happened to hold the first time a student booted it.
#
# This is not hypothetical tidiness. On 15 Aug 2026 apt-daily-upgrade.service started 80 s
# into an autotest batch and spent 05:42:54–05:44:18 installing 38 packages — libc6, systemd,
# udev, openssl and a new kernel — on the 1-vCPU build VM. The link-performance test ran
# inside that window, its node console went silent for 105 s, and the activity was recorded
# FAIL. Nothing was wrong with it; it passed five times in a row afterwards. Left in place the
# same thing happens in a classroom, and every appliance drifts from the one that was tested.
#
# The two timers are the schedule; the services they activate are masked as well, because
# unattended-upgrades also runs from a shutdown hook that no timer controls. The apt.conf
# drop-in is the belt to that pair of braces: an apt upgrade can restore 20auto-upgrades, and
# a later-sorting file in the same directory wins.
auto_updates:
  mask_units:
    - apt-daily.timer
    - apt-daily-upgrade.timer
    - apt-daily.service
    - apt-daily-upgrade.service
    - unattended-upgrades.service
  apt_periodic_file: /etc/apt/apt.conf.d/99-cqu-no-auto-upgrades

# The lab NIC — the GNS3 VM's third adapter, on an isolated hypervisor network shared with a
# Windows VM running beside it. The "Windows Host" Cloud template binds to it.
#
# The appliance's own 80_gns3vm_default_netcfg.yaml already declares eth2..eth8 and brings
# them up, but with `dhcp4: yes`. The `labnic` phase overrides that for this one interface,
# because a Cloud node bridges the *topology* onto it: leave DHCP on and the GNS3 VM takes a
# lease from the student's own lab the moment an activity runs a DHCP server. The filename
# must sort after the appliance's 80_/90_ files — netplan merges in order, last one wins.
#
# Absent on a VM with only two adapters, which the phase reports and tolerates.
lab_nic:
  interface: eth2
  netplan_file: /etc/netplan/95-cqu-lab-nic.yaml

# ---------------------------------------------------------------------------
# Profiles name the GNS3 VM's architecture — not the build host's, and not the audience.
# There is one appliance per architecture, and the architecture is the only axis anything
# here varies on: Docker platform, Qemu images, templates and project variants. The
# *hypervisor* is a separate concern and lives in ansible/build.sh — VirtualBox and VMware
# Fusion both host amd64 or arm64 VMs, so binding the two together (the old pc/mac naming)
# could not describe, say, an arm64 VM under Hyper-V on a Windows-on-ARM machine.
#
# There was a second axis until August 2026: profiles were <arch>-student / <arch>-staff and
# the staff appliance was the student one plus the 17 solution projects. Four OVAs a release,
# two export passes, for a difference of a few megabytes of project data. Solutions now go to
# staff through Moodle like every other handout.
# ---------------------------------------------------------------------------
profiles:
  amd64: { platform: amd64 }
  arm64: { platform: arm64 }

# Nodes enabled per platform, in install order. Keys reference `nodes:` below.
#
# This list is deliberately NOT trimmed to the projects in projects.txt. The appliance ships
# five demonstration projects but has to run every activity, because students import the rest
# themselves — so the images stay complete.
# NOTE: amd64 now uses the Docker FRR/NETem nodes (frrnode/netemnode) rather than the
# Qemu ones — this bakes in the Qemu->Docker migration.
#
# `optional:` is the other half of that migration. A Qemu node whose job has moved to a
# Docker one is RETIRED, not deleted: its `nodes:` entry, its download URL and md5 and its
# templates/*.conf all stay exactly as they were, and it moves out of `qemu:` into
# `optional.qemu:`. No ordinary build installs it, and `gns3build.py <phase> --with <key>`
# (or `--with all`) puts it back for one build — which is how a special-purpose appliance,
# say a staff VM that still wants the Qemu Ubuntu, stays a build flag instead of a git
# revert. `validate` checks optional nodes exactly like installed ones, so a retired node
# cannot quietly rot; `plan` lists what each platform offers.
#
# ORDER MATTERS in the `docker:` lists. cmd_docker builds them in list order, and three images
# are derived (`FROM cqugns3/alpinenode`): ipv6node, servicenode and monitornode. Each must
# appear AFTER alpinenode or its build has no base to build on. The phase also skips any image
# that already exists, so after changing alpinenode you must rebuild the derived images with
# --force or they keep the old base.
platforms:
  amd64:
    docker_platform: linux/amd64      # docker build --platform
    docker: [openvswitch, ipterm-base, ipterm, webterm, alpinenode, ubuntunode,
             net_toolbox, auth-kerberos, ipv6node, wazuh-agent, suricata, kali,
             frrnode, netemnode, openwrtnode, servicenode, monitornode, faucetnode, wifinode,
             giteanode, strongswan]
    qemu:   [opnsense]
    # Retired from the default build, still one flag away — see the note above.
    # ubuntu-cloud: retired 19 August 2026, its only consumer (the SDN controller) is now
    # the Docker cqugns3/faucetnode. openwrt: retired 19 August 2026, when the last three
    # activities using it (dhcp-client, dhcp-server-basics, dns-hosts) and the
    # Small-Internet-Demo moved to cqugns3/openwrtnode; no project or test topology names
    # it any more. frr-qemu/netem-qemu: superseded by frrnode/netemnode in the July 2026
    # Docker migration; they had been in no platform's list since, which made them
    # invisible to `validate` — being optional puts them back under it.
    optional:
      qemu: [openwrt, ubuntu-cloud, frr-qemu, netem-qemu]
    builtin: [windowshost]
  arm64:
    docker_platform: linux/arm64/v8
    docker: [openvswitch, ipterm-base, ipterm, webterm, alpinenode, ubuntunode,
             net_toolbox, auth-kerberos, ipv6node, wazuh-agent, suricata, kali,
             frrnode, netemnode, openwrtnode-arm64, servicenode, monitornode, faucetnode, wifinode,
             giteanode, strongswan]
    qemu:   [opnsense-arm64]
    optional:
      qemu: [openwrt-arm64, ubuntu-cloud-arm64]   # frr-qemu/netem-qemu are amd64-only disks
    builtin: [windowshost]
    # A .gns3project records each Qemu node's emulator path and disk *inside the file*, so a
    # project exported on a PC is permanently amd64 — the arm64 templates installed here are
    # not consulted for an imported node. Such a project cannot start on this platform (GNS3
    # answers 403 and logs nothing). Where an arm64 rebuild exists it is named
    # <Name>-arm64.gns3project and picked up automatically; projects with no Qemu node are
    # unaffected and need no variant.
    project_suffix: "-arm64"

# ---------------------------------------------------------------------------
# Node definitions. `templates` lists the templates/<name>.conf files to register
# for that node (one image can back several templates, e.g. alpinenode).
# ---------------------------------------------------------------------------
nodes:
  # --- Docker nodes built from the GNS3 registry ---
  #
  # Each `files:` entry may be a bare filename or a {name, sha256} mapping. The sha256 is
  # verified after download: it is the only thing standing between a moved upstream file and an
  # appliance that builds cleanly but behaves differently. Values below were taken at
  # registry_base's pinned commit on 14 August 2026 and match the images shipped in that build.
  openvswitch:
    kind: docker
    image: gns3/openvswitch:latest
    source:
      type: registry
      dir: docker/openvswitch
      files:
        - {name: Dockerfile, sha256: b817cd4f1f60d5a3a32ad360bc0fe6cc410306dc186581dc5338cf18a95c6ffc}
        - {name: init.sh,    sha256: 20a952d72cca2ead5e20fb7cec219831e90a35161a677940a4bdd9b6312185e0}
    templates: [docker-openvswitch]
  ipterm-base:
    kind: docker
    image: gns3/ipterm-base:latest
    source:
      type: registry
      dir: docker/ipterm/base
      files:
        - {name: Dockerfile, sha256: 7d3cc210c168e0f6d4d7045a0660daaedf446ff6436cccdc65349b9f31a0fae1}
    templates: []                       # support image, no template
  ipterm:
    kind: docker
    image: gns3/ipterm:latest
    source:
      type: registry
      dir: docker/ipterm/cli
      files:
        - {name: Dockerfile, sha256: b7bc4e65cbd1961857f3228ca3f6259307b49dec2a652cfa2204998a17614a8f}
    build_args: {DOCKER_REPOSITORY: gns3}
    templates: []
  webterm:
    kind: docker
    image: gns3/webterm:latest
    source:
      type: registry
      dir: docker/ipterm/web
      files:
        - {name: Dockerfile, sha256: 0c061e6285aa23ac7729c1b9e4585657698049b0106f7df7befb0224e6c961a5}
    build_args: {DOCKER_REPOSITORY: gns3}
    templates: [docker-firefoxhost]
  kali:
    kind: docker
    image: gns3/kalilinux:latest
    source:
      type: registry
      dir: docker/kalilinux
      files:
        - {name: Dockerfile,     sha256: 8d9619c9ef1a3d8bf36289f38287acf5212d5eb06c6462b84626e89c073e9a5b}
        - {name: index-1.html,   sha256: cb84ed11819fe35dcca617a315a4f027a72dca48bbb51c888e738ab2b7c705be}
    templates: [docker-kali]

  # --- Docker nodes built from this repo (server/docker/<name>/) ---
  alpinenode:
    kind: docker
    image: cqugns3/alpinenode:latest
    source: {type: local, path: alpinenode}
    templates: [docker-linuxhost, docker-linuxrouter, docker-vpnrouter, docker-ansiblehost]
  ubuntunode:
    kind: docker
    image: cqugns3/ubuntunode:latest
    source: {type: local, path: ubuntunode}
    # docker-trafficgen is the same image with a different name, symbol and usage text —
    # hping3/mgen/tcpreplay live in ubuntunode because Alpine does not package them in a
    # stable branch. No new image for a node that is three packages and a label.
    templates: [docker-ubuntuhost, docker-trafficgen]
  net_toolbox:
    kind: docker
    image: adosztal/net_toolbox:latest
    source: {type: local, path: net_toolbox}
    templates: [docker-linuxserver]
  auth-kerberos:
    kind: docker
    image: cqugns3/auth-kerberos:latest
    source: {type: local, path: auth-kerberos}
    templates: [docker-kerberos]
  ipv6node:
    kind: docker
    image: cqugns3/ipv6node:latest
    source: {type: local, path: ipv6node}
    templates: [docker-ipv6node]
  # IPsec gateway for the CLI VPN material — two of these replace the two Qemu OPNsense
  # firewalls in the site-to-site tunnel lab. DERIVED from alpinenode (so it must appear after
  # it in the lists above), which keeps strongSwan on the one node that needs it instead of on
  # every node in the appliance. One package, no new dependencies. See
  # gns3-dev/notes/opnsense-replacement.md.
  strongswan:
    kind: docker
    image: cqugns3/strongswan:latest
    source: {type: local, path: strongswan}
    templates: [docker-ipsecgw]
  wazuh-agent:
    kind: docker
    image: cqugns3/wazuh-agent:latest
    source: {type: local, path: wazuh-agent}
    templates: [docker-wazuh-agent]
  suricata:
    kind: docker
    image: cqugns3/suricata:latest
    source: {type: local, path: suricata}
    templates: [docker-suricata]
  frrnode:
    kind: docker
    image: cqugns3/frrnode:latest
    source: {type: local, path: frrnode}
    templates: [docker-frr]
  netemnode:
    kind: docker
    image: cqugns3/netemnode:latest
    source: {type: local, path: netemnode}
    templates: [docker-netem]
  # OpenWRT with the LuCI web interface, as a container rather than a Qemu VM. Built and verified
  # live on amd64 16 August 2026 — see gns3-dev/notes/openwrt-docker-node.md for what was measured
  # and why each line of the Dockerfile is there.
  #
  # TWO ENTRIES, ONE IMAGE. openwrt/rootfs publishes one architecture per tag rather than a
  # multi-arch manifest, and build_args is per-node rather than per-profile, so the base tag has to
  # come from a second node entry — the same shape the Qemu openwrt/openwrt-arm64 pair already uses.
  # Both produce cqugns3/openwrtnode:latest and both register docker-openwrt, and each profile
  # lists only its own.
  #
  # This does NOT yet retire the Qemu `openwrt` node: that template keeps the plain "OpenWRT" name
  # and the projects that reference it. Retiring it is a follow-up, and worth doing — a Docker
  # OpenWRT starts instantly, needs no /dev/kvm, and removes the -arm64 project variants.
  openwrtnode:
    kind: docker
    image: cqugns3/openwrtnode:latest
    source: {type: local, path: openwrtnode}
    build_args: {OPENWRT_TAG: x86-64-24.10.8}
    templates: [docker-openwrt]
  #
  # THE ARM TAG MUST BE PINNED BY DIGEST, AND THAT IS NOT A RE-BUILD-PROOFING PREFERENCE.
  # openwrt/rootfs labels each tag with OpenWRT's *package architecture*, not an OCI one, and
  # containerd's arch normaliser only rescues the x86 case (checked against the live registry
  # 17 Aug 2026):
  #
  #   x86-64-24.10.8            architecture: amd64               <- normalises, matches linux/amd64
  #   x86_64-24.10.8            architecture: amd64
  #   armsr-armv8-24.10.8       architecture: aarch64_generic     <- normalises to nothing
  #   aarch64_generic-24.10.8   architecture: aarch64_generic
  #   armsr-armv8 (snapshot)    architecture: aarch64_generic
  #   armsr-armv8-23.05.5       architecture: aarch64_generic
  #   armsr-armv7-24.10.8       architecture: arm_cortex-a15_neon-vfpv4
  #
  # `aarch64` would normalise to arm64; `aarch64_generic` does not, and OpenWRT has no plain
  # `aarch64` package arch, so NO arm tag of this image will ever match `--platform linux/arm64/v8`.
  # A plain tag fails the first arm64 build with
  #   ERROR: failed to solve: openwrt/rootfs:armsr-armv8-24.10.8: no match for platform in manifest
  # which is what the 17 Aug 2026 Mac build hit. Nothing to do with the GNS3 version on the VM.
  #
  # Appending the digest of the single image manifest inside that index sidesteps the platform
  # match entirely: buildkit filters on platform only when it has to choose *within* an index, so
  # a ref that already names one manifest is fetched as-is. `repo:tag@sha256:…` is a legal
  # reference and the digest wins; the tag is kept for readability.
  #
  # PROVEN, 17 Aug 2026, on a Docker 28.1.1 host, both halves back to back with `--platform
  # linux/arm64/v8`: the plain tag reproduces the Mac's exact error, the digest form builds. The
  # digest build emits one warning and it is the expected one, not a problem —
  #   InvalidBaseImagePlatform: Base image … was pulled with platform "linux/aarch64_generic",
  #   expected "linux/arm64" for current build
  # — and the *output* image is stamped `Architecture=arm64 Os=linux`, because buildkit takes the
  # built image's platform from the build request rather than from the base image's bogus label.
  # That is what matters: GNS3 and Docker on the Mac see a normal arm64 image. The RUN steps were
  # not exercised (an amd64 host has no arm64 binfmt handler); they run natively on the Mac.
  #
  # Re-resolve the digest when bumping the OpenWRT release:
  #   docker buildx imagetools inspect openwrt/rootfs:<tag> --raw   # or the registry API
  # and take the digest of the manifests[] entry whose platform.os is linux.
  openwrtnode-arm64:
    kind: docker
    image: cqugns3/openwrtnode:latest
    source: {type: local, path: openwrtnode}
    build_args:
      OPENWRT_TAG: "armsr-armv8-24.10.8@sha256:f6dd33c1d9b7d6f1e0848f2fbb92b8d03fc9b425dc08c3574a44936b93133704"
    templates: [docker-openwrt]
  # Network services: BIND and chrony, plus the Tier 5 services-and-operations group added
  # 15 August 2026 (PostgreSQL, Valkey, Kea DHCP, NetFlow, and fail2ban/monit/goaccess tooling).
  # One image behind several templates. A service gets its own *template* when it occupies its own
  # box on the topology diagram; it gets its own *image* only when it drags in a runtime the others
  # do not need. None of the Tier 5 group does — python3 and openssh come from alpinenode — so the
  # whole group joins here and the image stays well under decision D2's 150 MB-over-alpinenode
  # budget. Anything larger (the observability stack) already has its own image (monitornode).
  # fail2ban, monit and goaccess ship on the image as tools without their own template. Live
  # feasibility and per-service design: gns3-dev/notes/tier5-and-spike-designs.md.
  servicenode:
    kind: docker
    image: cqugns3/servicenode:latest
    source: {type: local, path: servicenode}
    # Flow Collector is now registered. The exporter spike resolved 15 August 2026: softflowd 1.1.0
    # receives packets via libpcap but processes 0 inside a GNS3 container (exports nothing), so the
    # image ships fprobe instead — it builds and exports NetFlow correctly in the same container, is
    # 32 KB, and is in Alpine main for both amd64 and arm64. Proven end-to-end in a live GNS3
    # topology (probe builds flows -> nfcapd collects -> nfdump/flow-status.sh reads them). See
    # gns3-dev/notes/tier5-and-spike-designs.md.
    templates: [docker-dnsserver, docker-ntpserver, docker-dbserver, docker-cacheserver,
                docker-dhcpserver, docker-flowcollector, docker-fileserver]
  # Prometheus + Grafana + blackbox_exporter. Own image rather than joining servicenode
  # because Grafana (331 MB) and Prometheus (224 MB) are exactly the runtime the rule above
  # splits on. Alpine-based because Grafana is not in Ubuntu's archive at any version.
  monitornode:
    kind: docker
    image: cqugns3/monitornode:latest
    source: {type: local, path: monitornode}
    templates: [docker-monitor]
  # Faucet SDN controller. Its own image because it drags in a Python venv with a compiled
  # extension, which is the runtime split the rule above describes; Alpine-based like every
  # other CQU service node. This replaces the Qemu Ubuntu VM that sdn-basics used as its
  # controller, and with it the ubuntu-cloud disk in both OVAs and the 729 MB
  # SDN-Basics-Template.gns3project that could not be committed — see the Dockerfile.
  faucetnode:
    kind: docker
    image: cqugns3/faucetnode:latest
    source: {type: local, path: faucetnode}
    templates: [docker-faucet]
  # Wireless node: a simulated 802.11 radio + hostapd/wpa_supplicant. One image, two templates
  # (Access Point, Station). Needs the mac80211_hwsim kernel module (above) and the host-side
  # gns3-wifi-attach helper (server/wifi/) to move a radio into each node after Start — a GNS3 node
  # cannot see the host's radios from inside its own netns. Derives from alpinenode (+~8 MB). Live
  # design and spike in gns3-dev/notes/tier5-and-spike-designs.md, Design 1.
  wifinode:
    kind: docker
    image: cqugns3/wifinode:latest
    source: {type: local, path: wifinode}
    templates: [docker-accesspoint, docker-station]
  # Gitea git server (Git Server template). Its own image: Gitea is a ~133 MB Go binary + web-app
  # assets, the "drags in a runtime the others do not need" case D2 splits on. SQLite built in, so no
  # database node. Web UI on port 3000 (reach it from a Firefox Host), git over HTTP. Tier 2 Module
  # 3b — see gns3-dev/notes/tier2-file-backup-git.md.
  giteanode:
    kind: docker
    image: cqugns3/giteanode:latest
    source: {type: local, path: giteanode}
    templates: [docker-giteanode]

  # --- Built-in nodes: a template over a GNS3 built-in node type, nothing to install ---
  # The Windows Host is a Cloud node bound to the lab NIC above, where a Windows VM running
  # beside the GNS3 VM is reachable. There is no image: the template IS the node. It is
  # listed here so `templates` and `validate` pick it up; `docker` and `qemu` select by kind
  # and ignore it.
  #
  # Note for anyone editing cloud-windowshost.conf: cloud templates reject a `usage` field
  # (qemu and docker templates accept one), so the node's explanation lives in the student
  # guide rather than in the GNS3 UI. Adding one back fails the templates phase with
  # "Additional properties are not allowed ('usage' was unexpected)".
  windowshost:
    kind: builtin
    templates: [cloud-windowshost]

  # --- Qemu images ---
  # file:   name under qemu_images_dir (post-unpack); md5 is of *this* file
  # unpack: gzip | bzip2 | zip | none (default none)
  # resize: optional `qemu-img resize` argument, e.g. "+2G" (applied after md5 verify)
  # extra:  companion files the node's template also needs (same keys), e.g. a cdrom ISO

  # --- Qemu images (amd64) ---
  # OPTIONAL since 19 August 2026. The Docker cqugns3/openwrtnode does this node's job on both
  # architectures, boots in seconds rather than minutes without nested virtualisation, and — the
  # reason this one mattered most — leaves the projects that contain it architecture-neutral, so
  # DHCP-Client-Solution no longer needs an -arm64 twin. Kept whole in case a Qemu OpenWRT is ever
  # wanted again (a real kernel, its own network stack): `--with openwrt`.
  openwrt:
    kind: qemu
    file: openwrt-23.05.0-x86-64-generic-ext4-combined.img
    url: https://downloads.openwrt.org/releases/23.05.0/targets/x86/64/openwrt-23.05.0-x86-64-generic-ext4-combined.img.gz
    unpack: gzip
    md5: 8d53c7aa2605a8848b0b2ca759fc924f
    templates: [qemu-openwrt]
  opnsense:
    kind: qemu
    file: OPNsense-24.1-nano-amd64.img
    url: https://opnsense.c0urier.net/releases/24.1/OPNsense-24.1-nano-amd64.img.bz2
    unpack: bzip2
    md5: ea8472df2c272419b7834cddaf68048d
    templates: [qemu-opnsense]
  # OPTIONAL since 19 August 2026 — nothing installs it unless `--with ubuntu-cloud` asks.
  # It existed to back SDN-Basics-Template's controller disk, and that controller is now the
  # Docker cqugns3/faucetnode: sdn-basics passes on both architectures without this image
  # (amd64 15 August, arm64 18 August 2026), and no other activity or project ever used it.
  # Retiring it takes 561 MB + a 368 KB ISO off every appliance.
  #
  # Kept whole rather than deleted so a general-purpose Ubuntu VM is a build flag away. If
  # you do bring it back, the `resize` is not optional: the old SDN controller node was a
  # qcow2 *overlay* whose backing file is this image at exactly this size.
  ubuntu-cloud:
    kind: qemu
    file: ubuntu-24.04-server-cloudimg-amd64.img
    url: https://cloud-images.ubuntu.com/releases/noble/release-20241004/ubuntu-24.04-server-cloudimg-amd64.img
    md5: a1c8a01953578ad432cbef03db2f3161
    resize: "+2G"
    extra:
      - file: ubuntu-cloud-init-data.iso
        url: https://github.com/GNS3/gns3-registry/raw/master/cloud-init/ubuntu-cloud/ubuntu-cloud-init-data.iso
        md5: 9a90ee8f88736204c756015b3cd86500
    templates: [qemu-ubuntu]

  # --- Qemu images (arm64) ---
  openwrt-arm64:
    kind: qemu
    file: openwrt-23.05.0-armsr-armv8-generic-ext4-combined.img
    url: https://archive.openwrt.org/releases/23.05.0/targets/armsr/armv8/openwrt-23.05.0-armsr-armv8-generic-ext4-combined.img.gz
    unpack: gzip
    md5: bbb6191154e26079b19a1337d2545442
    templates: [qemu-openwrt-arm64]
  opnsense-arm64:
    kind: qemu
    file: OPNsense-24.1-ufs-efi-vm-aarch64.qcow2
    url: https://github.com/maurice-w/opnsense-vm-images/releases/download/24.1/OPNsense-24.1-ufs-efi-vm-aarch64.qcow2.bz2
    unpack: bzip2
    md5: 99c897037a166a7ffedb56a3621bd3d1
    templates: [qemu-opnsense-arm64]
  ubuntu-cloud-arm64:
    kind: qemu
    file: ubuntu-24.04-server-cloudimg-arm64.img
    # cloud-images-archive.ubuntu.com does not serve https; integrity is verified by md5
    # (published at .../releases/noble/release-20241004/MD5SUMS)
    url: http://cloud-images-archive.ubuntu.com/releases/noble/release-20241004/ubuntu-24.04-server-cloudimg-arm64.img
    md5: 9b4b8ee2be8ad36a5cedd2f2c4356e6f
    resize: "+2G"
    extra:
      - file: ubuntu-cloud-init-data.iso
        url: https://github.com/GNS3/gns3-registry/raw/master/cloud-init/ubuntu-cloud/ubuntu-cloud-init-data.iso
        md5: 9a90ee8f88736204c756015b3cd86500
    templates: [qemu-ubuntu-arm64]

  # --- Qemu images reachable only through `optional:` ---
  # Superseded by frrnode/netemnode in the July 2026 Docker migration. They are listed in
  # amd64's `optional.qemu:`, so `--with frr-qemu` still builds them and `validate` still
  # checks their templates — which it could not while they were in no list at all.
  frr-qemu:
    kind: qemu
    file: frr-8.2.2.qcow2
    url: http://downloads.sourceforge.net/project/gns-3/Qemu%20Appliances/frr-8.2.2.qcow2
    md5: 45cda6b991a1b9e8205a3a0ecc953640
    templates: [qemu-frr]
  netem-qemu:
    kind: qemu
    file: NETem-v4.qcow2
    url: https://sourceforge.net/projects/gns-3/files/Qemu%20Appliances/NETem-v4.qcow2/download
    md5: e678698c97804901c7a53f6b68c8b861
    templates: [qemu-netem]
