
# =============================================================================================
# Lab RADIUS clients (added by the CQU GNS3 image; everything above is FreeRADIUS's own file).
#
# A RADIUS "client" is the network device that asks the questions: a switch doing 802.1X, a
# Wi-Fi access point doing WPA2-Enterprise, a VPN concentrator. It is NOT the user's laptop:
# the laptop talks EAP to the switch, and only the switch talks RADIUS to this server.
# The RFCs call a RADIUS client a Network Access Server (NAS), which is why requests carry
# NAS-IP-Address and NAS-Port. It has nothing to do with network-attached storage.
#
# The server answers only clients listed here, and only when the request was signed with the
# matching shared secret. A wrong secret gets no answer at all: the server drops the request,
# so the client just times out ("No reply from server"), which looks like a network fault rather
# than a configuration one. The server's log says what happened.
#
# The shared secret also hides the User-Password attribute in transit. It hides ONLY that
# attribute: the user name, the client's address and every other attribute are readable by
# anyone who can capture the traffic.
#
# Run start-radius.sh after editing this file; it checks the configuration first.
# =============================================================================================

# Any device on the lab subnet. Narrow this to one address (ipaddr = 192.168.1.2) to see the
# server ignore everyone else.
client lab-net {
	ipaddr = 192.168.1.0/24
	secret = labsecret
	shortname = lab-net
}

# Design 2's 802.1X access switch. It is the only client allowed to make the Authorize-Only
# VLAN lookup in policy.d/nac. Uncomment and set its address when the topology has one.
