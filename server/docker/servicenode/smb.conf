# Samba configuration for the GNS3 lab File Server.
#
# Samba speaks SMB/CIFS — the same protocol Windows "shared folders" and mapped network drives use,
# and what most office file shares run. This node shares two folders so a client on the network can
# read and write them over SMB. The config IS the lesson: it is short and every share is a few
# lines. Edit with nano, then restart with: start-fileserver.sh
#
# Two shares on purpose, so the access-control difference is visible:
#   \\<server>\public   — anyone (guest), read and write. The easy "shared team folder".
#   \\<server>\private  — only the 'student' user, with a password. The locked share.
# This is the same idea as a cloud drive's "anyone with the link can edit" vs "only these people".

[global]
   workgroup = WORKGROUP
   server string = CQU Lab File Server
   # security = user: clients authenticate as a user. map to guest = Bad User lets an unknown user
   # fall through to guest access, which is what makes the [public] share reachable with no password.
   security = user
   map to guest = Bad User
   # SMB2+ only — SMB1 is obsolete and insecure. Modern clients negotiate SMB3.
   server min protocol = SMB2
   log file = /var/log/samba/log.%m
   max log size = 50

[public]
   comment = Public share — anyone on the network, read and write
   path = /srv/public
   browseable = yes
   read only = no
   guest ok = yes

[private]
   comment = Private share — only the 'student' user, with a password
   path = /srv/private
   browseable = yes
   read only = no
   guest ok = no
   valid users = student
