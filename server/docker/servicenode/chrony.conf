# chrony configuration for the CQU GNS3 NTP Server node.
#
# READ THIS FIRST — what a container node can and cannot do with time.
#
# Every Docker node on the GNS3 VM shares the host kernel's clock. There is no per-node clock
# to set: `date -s` inside a node is denied, and chronyd on a client node cannot step or slew
# anything either. So in these activities:
#
#   * this node SERVES time, and that works normally;
#   * a client MEASURES the offset instead of correcting it —
#         chronyd -Q 'server <ntp-server-ip> iburst'      one-shot, prints the offset
#         chronyc -h <ntp-server-ip> tracking             ask the server about itself
#   * a skewed clock is simulated per-process with faketime, e.g.
#         faketime '+6 minutes' kinit student             Kerberos rejects it (skew > 5 min)
#
# That is a real limit of container nodes, not a shortcut. A lab that needs a genuinely wrong
# system clock needs a Qemu node.

# ---------------------------------------------------------------------------------------
# Serving time
# ---------------------------------------------------------------------------------------

# A GNS3 topology usually has no route to a real time source, and chronyd will not serve time
# it does not trust. `local stratum 8` says: even with no upstream, act as a valid source at
# stratum 8. Stratum 1 is a server attached to a reference clock (GPS, atomic); each hop away
# adds one. 8 is deliberately poor — it says "usable, and obviously not authoritative".
local stratum 8

# Who may ask this server for the time. Narrow this to your lab subnet in an activity about
# access control: an NTP server open to the internet is a classic reflection/amplification
# source, because a small query can produce a large reply.
allow 10.0.0.0/8
allow 172.16.0.0/12
allow 192.168.0.0/16

# Where chronyd records the rate at which the local clock drifts.
driftfile /var/lib/chrony/chrony.drift

# ---------------------------------------------------------------------------------------
# Taking time from upstream — only useful if the topology has internet
# ---------------------------------------------------------------------------------------
# Uncomment ONE of these if the topology can reach the internet (see the gns3-internet-nat
# activity). With a real source configured, `chronyc sources` on this node becomes interesting:
# it shows the candidates, which one was selected (*), and the measured offset to each.
#
# pool pool.ntp.org iburst
# server au.pool.ntp.org iburst

# Allow chronyc to be run from other nodes as well as locally, so students can query this
# server from a client without opening a console on it.
cmdallow 10.0.0.0/8
cmdallow 172.16.0.0/12
cmdallow 192.168.0.0/16
bindcmdaddress 0.0.0.0
