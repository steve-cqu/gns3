# Valkey configuration for the GNS3 lab node.
#
# Valkey is a Redis fork; the config grammar is identical to redis.conf, and everything you read
# about redis.conf applies here. This file is deliberately short and heavily commented — the config
# IS the lesson. Edit it with nano, then restart with: start-cache.sh
#
# The teaching point of this node is exposure. A cache with no password, reachable from the whole
# network, is one of the most common real-world compromises: an attacker connects, runs CONFIG or
# reads every key, and the service was never meant to face anyone but the application beside it.
# This node ships in exactly that state so you can see it, then fix it. The fix is the last two
# settings below.

# Listen on every interface. A service bound only to 127.0.0.1 cannot be reached from another node,
# so a lab cache has to bind wider — but "every interface" is also the exposure. Narrow this to the
# one interface the application uses once you have seen why it matters.
bind 0.0.0.0
port 6379

# protected-mode no is what makes this node the teaching example. With it 'no', any host that can
# reach port 6379 can issue commands with no authentication at all. Turn it back to 'yes' (or set a
# password below) and Valkey refuses commands from non-loopback clients until they authenticate —
# that is the fix the activity asks you to make and then re-test with valkey-cli from another node.
protected-mode no

# --- The fix (commented out on purpose) ---
# Uncomment requirepass and restart, then observe that valkey-cli now needs `-a <password>` or an
# AUTH command before it will answer. gns3 is the appliance's throwaway lab password; change it.
# requirepass gns3

# Keep the node quiet and stateless for a teaching lab. Valkey normally snapshots to disk; here we
# leave persistence off so each lab starts clean. Turn 'save' back on (e.g. save 60 100) if you are
# teaching durability rather than caching.
save ""
appendonly no

# Log to a file the student can read with cache-status.sh rather than to the console.
logfile /var/log/valkey/valkey.log
dir /var/lib/valkey
