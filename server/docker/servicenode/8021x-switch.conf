# /etc/nac/switch.conf — the 802.1X Switch's settings. Read by start-8021x-switch.sh; run that
# script again after editing this file.
#
# How the switch works
# --------------------
# eth0 is the switch's MANAGEMENT port: it is not part of the switch, it carries the switch's own
# address, and it is how the switch talks RADIUS to the server. Give it an address with
# `ip addr add ... dev eth0` like any node.
#
# The ACCESS ports are where users plug in. Each one starts SHUT: it passes only 802.1X login
# traffic (EAPOL) until a user on it logs in. The switch relays that login to the RADIUS server,
# and on an Access-Accept it opens the port in the user's VLAN. Log off, and the port shuts again.
#
# The TRUNK port carries every VLAN, tagged, to the router that connects them.

# The RADIUS server, and the shared secret this switch uses with it. The server must list this
# switch in its clients.conf with the same secret, and with the short name sw1 (the server's
# VLAN-lookup policy answers only sw1).
RADIUS_SERVER=192.168.1.10
RADIUS_SECRET=labsecret

# The switch's own name, sent to the server as NAS-Identifier.
SWITCH_NAME=sw1

# Ports. eth0 is management and is never listed here.
ACCESS_PORTS="eth1 eth2 eth3 eth4"
TRUNK_PORT=eth5

# The VLANs the trunk carries. A user the server gives no VLAN lands in QUARANTINE_VLAN.
VLANS="10 20 50 99"
QUARANTINE_VLAN=99
