// Kea DHCPv4 server configuration for the GNS3 lab node.
//
// Kea is ISC's modern DHCP server and the supported successor to isc-dhcp-server, which reached
// end of life upstream in 2022 (the older daemon still ships on the Linux Server node for the
// migration lesson). The config is JSON with // comments, which Kea accepts. Edit with nano, then:
//   start-dhcp.sh      (it runs `kea-dhcp4 -t` first, so a broken config is reported, not started)
// Watch it with:       dhcp-status.sh
//
// This ships as a valid, working single-subnet server. The teaching edits are the obvious ones:
// change the pool, add a reservation, add options, or add a second subnet.
{
  "Dhcp4": {
    // Listen on every interface. In a lab the DHCP server usually has one NIC facing the client
    // segment; "*" avoids having to name it. Narrow it to e.g. [ "eth0" ] once you know the link.
    "interfaces-config": {
      "interfaces": [ "*" ]
    },

    // Leases are stored as a CSV file (memfile backend) under a persisted directory, so a lease a
    // client received survives the project being closed. `dhcp-status.sh` reads this file.
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv"
    },

    // How long a lease lasts. Short in a lab so you can watch renewals without waiting.
    "valid-lifetime": 600,
    "renew-timer": 300,
    "rebind-timer": 525,

    // One subnet. Add more objects to this array to serve several segments.
    "subnet4": [
      {
        "id": 1,
        "subnet": "192.168.1.0/24",
        "pools": [ { "pool": "192.168.1.100 - 192.168.1.200" } ],

        // Options handed to every client in this subnet. Router and DNS are the two that matter
        // first; edit them to match your topology.
        "option-data": [
          { "name": "routers", "data": "192.168.1.1" },
          { "name": "domain-name-servers", "data": "192.168.1.1" },
          { "name": "domain-name", "data": "example.com" }
        ]

        // A fixed address for one host, by MAC — uncomment and edit to teach reservations:
        // ,"reservations": [
        //   { "hw-address": "02:00:00:00:00:10", "ip-address": "192.168.1.50" }
        // ]
      }
    ],

    // Log to a file the student reads with dhcp-status.sh.
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [ { "output": "/var/log/kea/kea-dhcp4.log" } ],
        "severity": "INFO"
      }
    ]
  }
}
