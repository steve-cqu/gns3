# swanctl.conf — the whole IPsec configuration for this gateway.
#
# Two sections. `connections` describes the tunnel: who the peers are, what to negotiate,
# and which subnets the tunnel carries. `secrets` holds the key that authenticates it.
# Fill both in, then run `start-ipsec.sh` to start the daemon and load this file.
#
# ONE SETTING PER LINE. Writing `local { auth = psk  id = 10.0.0.1 }` on a single line is
# rejected with "invalid value for: auth, config discarded" — the parser takes the rest of
# the line as the value of `auth`.
#
# Every available setting with its default is in swanctl.conf.reference in this directory
# (588 lines, shipped by strongSwan itself). `man swanctl.conf` is the same material.

connections {

}

secrets {

}

# Include config snippets
include conf.d/*.conf
