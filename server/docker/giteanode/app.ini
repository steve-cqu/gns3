; Gitea configuration for the GNS3 lab Git server.
;
; Gitea is a self-hosted Git service with a web UI — a small, self-contained GitHub/GitLab. It ships
; here with a SQLite database (no separate database node needed), git access over HTTP, and the web
; installer locked so it comes up ready. The config IS the lesson where you want it to be; most
; students never edit it — start-gitea.sh brings the server up, and the web UI does the rest.
;
; DOMAIN and ROOT_URL are rewritten to this node's own IP by start-gitea.sh, so the clone URLs the
; web UI shows are the ones that actually work from other nodes.

APP_NAME = CQU Lab Gitea
RUN_USER = gitea
RUN_MODE = prod
WORK_PATH = /var/lib/gitea

[server]
PROTOCOL = http
HTTP_PORT = 3000
DOMAIN = localhost
ROOT_URL = http://localhost:3000/
; Git access is over HTTP in this lab (clone with http://user:pass@host:3000/owner/repo.git), so the
; built-in SSH server is off — no keys to set up. (git-basics teaches the SSH path; this node is the
; web path.)
DISABLE_SSH = true
LFS_START_SERVER = false

[database]
DB_TYPE = sqlite3
PATH = /var/lib/gitea/data/gitea.db

[repository]
ROOT = /var/lib/gitea/data/repositories

[security]
; INSTALL_LOCK skips the one-time web installer — the server is already configured. Change the
; SECRET_KEY for anything real; this is a throwaway lab value. Password rules are relaxed so the
; lab credentials are simple.
INSTALL_LOCK = true
SECRET_KEY = cqu-lab-gitea-secret-change-me
PASSWORD_COMPLEXITY = off
MIN_PASSWORD_LENGTH = 6

[service]
; No open sign-ups: the admin (created by start-gitea.sh) makes any other accounts. The web UI is
; readable without signing in, so a browser can see repos immediately.
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = false
DEFAULT_KEEP_EMAIL_PRIVATE = false

[log]
ROOT_PATH = /var/lib/gitea/log
LEVEL = warn
