; Grafana configuration for the CQU GNS3 Monitor node.
;
; Grafana layers its settings: /usr/share/grafana/conf/defaults.ini holds every default and
; this file overrides only what a lab environment needs. That is why it is short — replacing
; the whole file would mean re-tracking Grafana's defaults at every version bump.

[paths]
; Dashboards live in grafana.db under this directory. It is in the node's persisted volumes,
; because the dashboard is the assessed output of the monitoring activity.
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins

[server]
http_port = 3000
; Listen on every interface — a GNS3 node gets its addresses after the container starts, so
; there is nothing specific to bind to here.
http_addr =

[security]
; Documented in the node's usage text in the GNS3 UI, and in the activity instructions.
; Set explicitly rather than left at Grafana's admin/admin, which triggers a forced password
; change on first login and costs every student the same two confusing minutes.
admin_user = admin
admin_password = gns3

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[analytics]
; An isolated topology has no route to the internet. Left on, Grafana spends its startup
; trying to reach grafana.com for version and plugin checks, which shows up as a slow first
; page load and a log full of DNS failures that have nothing to do with the student's work.
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false

[log]
mode = file
level = info
