# wpa_supplicant configuration for the GNS3 wireless lab — the Station (client).
#
# wpa_supplicant is the client side of Wi-Fi: it scans for the SSID, and completes the WPA2-PSK
# four-way handshake with the access point using the shared passphrase. The config IS the lesson.
# Edit with nano (the SSID and psk must match the AP's hostapd.conf), then run: start-sta.sh
#
# Before this works the node needs its radio: wlan0 only exists after the host-side
# `gns3-wifi-attach` helper has moved a simulated radio into this node. start-sta.sh checks for it.

# Allow this user to reconfigure the supplicant over its control socket (wifi-status.sh uses it).
ctrl_interface=/run/wpa_supplicant
update_config=1

network={
    # The AP's network name. Must match ssid= in the AP's hostapd.conf.
    ssid="cqu-lab"

    # The pre-shared key — the same passphrase as wpa_passphrase= on the AP. This is the secret
    # the four-way handshake proves both ends know without ever sending it. Change both together.
    psk="cqu-wifi-lab"

    # Prefer WPA2 (RSN) with the CCMP/AES cipher, matching the AP.
    key_mgmt=WPA-PSK
    proto=RSN
    pairwise=CCMP
}
