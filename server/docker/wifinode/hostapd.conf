# hostapd configuration for the GNS3 wireless lab — the Access Point.
#
# hostapd turns a radio into an access point: it beacons an SSID, and runs WPA2-PSK so a station
# must know the passphrase and complete a four-way handshake before it is associated. The config IS
# the lesson — it is short and every line matters. Edit with nano, then restart with: start-ap.sh
#
# Before this works the node needs its radio: the interface below (wlan0) only exists after the
# host-side `gns3-wifi-attach` helper has moved a simulated radio into this node. start-ap.sh checks
# for wlan0 and tells you if it is missing.

# The radio interface moved into this node. mac80211_hwsim always presents it as wlan0.
interface=wlan0

# nl80211 is the modern driver interface for mac80211 radios (which hwsim is).
driver=nl80211

# The network name the AP beacons. Change it and the station's wpa_supplicant.conf must match.
ssid=cqu-lab

# 2.4 GHz band (g), channel 6. The station does not set a channel — it scans and finds the AP.
hw_mode=g
channel=6

# --- Security: WPA2-PSK (the teaching pair with wpa_supplicant.conf) ---
# wpa=2 selects WPA2 (RSN). The pre-shared key is the passphrase every station must know; the
# four-way handshake derives fresh per-session keys from it, which is what you capture on mon0.
# CCMP (AES) is the WPA2 cipher; TKIP is deliberately not offered.
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=cqu-wifi-lab

# Control socket, so `hostapd_cli` and wifi-status.sh can query the running AP.
ctrl_interface=/run/hostapd

# --- WPA2-Enterprise (802.1X): the alternative to the passphrase above ---
# Instead of one shared passphrase, every user logs in with their own name and password, and the
# AP asks a RADIUS server whether to let them in. The AP is the RADIUS *client*; the server must
# list it (clients.conf) with the same shared secret. Each login also gives the station and the AP
# a key of their own, which the server sends to the AP inside its Access-Accept.
#
# To switch: put a # in front of wpa_key_mgmt=WPA-PSK and wpa_passphrase= above, remove the # from
# the lines below, and set the server's address and secret. An Enterprise AP is normally bridged
# onto the wired network where the RADIUS server is (bridge=br0), and start-ap.sh is then given
# the AP's address on that network, e.g.  start-ap.sh 192.168.1.2/24
#bridge=br0
#wpa_key_mgmt=WPA-EAP
#ieee8021x=1
#auth_server_addr=192.168.1.10
#auth_server_port=1812
#auth_server_shared_secret=labsecret
#own_ip_addr=192.168.1.2
#nas_identifier=ap1

# --- Rogue access point (the Evil Twin): hostapd's own EAP server ---
# A real WPA2-Enterprise AP forwards every login to a RADIUS server it trusts (the block above).
# A rogue AP has no such server, so it runs hostapd's OWN built-in EAP server (eap_server=1) and
# presents a certificate it made itself (certs below). It beacons the SAME ssid=cqu-lab as the real
# AP. A station that does NOT check the server's certificate (no ca_cert= in wpa_supplicant.conf)
# will build the PEAP tunnel with this rogue and send its user name and MSCHAPv2 response inside it,
# which hostapd logs — the station has handed its credentials to the attacker. A station that DOES
# set ca_cert= (and domain_match=) refuses, because this certificate is self-signed and does not
# chain to the lab CA. That refusal is the whole lesson of the Evil Twin activity.
#
# This AP stands alone — no bridge= line, so start-ap.sh puts the address on wlan0. To switch:
# put a # in front of wpa_key_mgmt=WPA-PSK and wpa_passphrase= above, remove the # from the lines
# below, then:  start-ap.sh 192.168.50.1/24
#wpa_key_mgmt=WPA-EAP
#ieee8021x=1
#eap_server=1
#eap_user_file=/etc/hostapd/hostapd.eap_user
#ca_cert=/etc/hostapd/rogue/rogue.pem
#server_cert=/etc/hostapd/rogue/rogue.pem
#private_key=/etc/hostapd/rogue/rogue.key
