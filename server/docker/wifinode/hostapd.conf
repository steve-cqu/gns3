# hostapd configuration for the GNS3 wireless lab — the Access Point.
#
# hostapd turns a radio into an access point: it beacons an SSID, and runs WPA2-PSK so a station
# must know the passphrase and complete a four-way handshake before it is associated. The config IS
# the lesson — it is short and every line matters. Edit with nano, then restart with: start-ap.sh
#
# Before this works the node needs its radio: the interface below (wlan0) only exists after the
# host-side `gns3-wifi-attach` helper has moved a simulated radio into this node. start-ap.sh checks
# for wlan0 and tells you if it is missing.

# The radio interface moved into this node. mac80211_hwsim always presents it as wlan0.
interface=wlan0

# nl80211 is the modern driver interface for mac80211 radios (which hwsim is).
driver=nl80211

# The network name the AP beacons. Change it and the station's wpa_supplicant.conf must match.
ssid=cqu-lab

# 2.4 GHz band (g), channel 6. The station does not set a channel — it scans and finds the AP.
hw_mode=g
channel=6

# --- Security: WPA2-PSK (the teaching pair with wpa_supplicant.conf) ---
# wpa=2 selects WPA2 (RSN). The pre-shared key is the passphrase every station must know; the
# four-way handshake derives fresh per-session keys from it, which is what you capture on mon0.
# CCMP (AES) is the WPA2 cipher; TKIP is deliberately not offered.
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=cqu-wifi-lab

# Control socket, so `hostapd_cli` and wifi-status.sh can query the running AP.
ctrl_interface=/run/hostapd
