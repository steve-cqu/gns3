# Ansible settings for the GNS3 VM build wrapper.
# Used automatically when ansible-playbook is run from this directory (or via build.sh).
[defaults]
inventory              = inventory.ini
host_key_checking      = False        # the VM is rebuilt often; its host key changes
display_skipped_hosts  = False
retry_files_enabled    = False
interpreter_python     = auto_silent

[ssh_connection]
pipelining = True
# ControlMaster keeps one connection open across the many tasks in a build.
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
