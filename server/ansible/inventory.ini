# Default inventory for the GNS3 VM build.
#
# build.sh discovers the VM's IP from the hypervisor and passes it with
#   -i <ip>,            (note the trailing comma — an inline host list)
# which overrides this file. Edit the address here to run ansible-playbook by hand:
#
#   ansible-playbook site.yml -e profile=pc-student
#
# Auth: a stock GNS3 VM logs in as gns3/gns3 with passwordless sudo, so that is the
# fallback and the playbook works out of the box. It is the vendor's published default,
# not a secret — but if you have changed it (you should, before handing a VM out), set
# GNS3_VM_PASSWORD in the environment instead of editing this file. Better still, install
# an SSH key and set ansible_ssh_private_key_file, which needs no password and no sshpass.

[gns3vm]
192.168.56.106

[gns3vm:vars]
ansible_user=gns3
ansible_password="{{ lookup('env', 'GNS3_VM_PASSWORD') | default('gns3', true) }}"
ansible_become=false
