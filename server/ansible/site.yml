---
# Host-driven GNS3 VM build — the Layer 1 wrapper around build/gns3build.py.
#
#   ansible-playbook site.yml -e profile=pc-student
#   ansible-playbook -i 192.168.56.106, site.yml -e profile=pc-staff
#
# or, discovering the VM's IP from the hypervisor first, `./build.sh <vm-name> <profile>`.
#
# This playbook is deliberately thin: gns3build.py is the engine and every phase it runs
# is idempotent, so the playbook's job is only to (1) put the repo on the VM, (2) invoke
# the engine, (3) import the projects, and (4) verify. Re-running is safe and cheap.
#
# Projects are imported *from the control node* over the API rather than being synced to
# the VM first. SDN-Basics-Template alone is 729 MB; syncing it would copy that to the
# VM's disk and then import it from there, doubling both the transfer and the space.

- name: Build the GNS3 VM
  # `all`, not `gns3vm`: build.sh passes the discovered IP as an inline inventory
  # (-i "<ip>,"), which puts the host in no group at all. Targeting the group meant the
  # play matched nothing and ansible-playbook still exited 0 — a build that silently did
  # nothing and reported success. With `all` both inventory forms work, and inventory.ini
  # keeps its [gns3vm:vars] because that host is still in `all`.
  hosts: all
  gather_facts: true

  vars:
    # Which profile to build: {pc,mac}-{student,staff}. No default — it decides the
    # architecture and the project set, so it must be a conscious choice.
    # profile: pc-student

    # Repo locations on the *control node*. Defaults assume the standard side-by-side
    # checkout: <workspace>/gns3 (public) and <workspace>/gns3-dev (private).
    gns3_repo: "{{ playbook_dir }}/../.."
    gns3_dev_repo: "{{ playbook_dir }}/../../../gns3-dev"
    extra_project_dir: "{{ playbook_dir }}/../../../infiles"

    # Where the repo lands on the VM.
    vm_repo_dir: /home/gns3/git/gns3

    # Project search roots, in order — the authoritative copy MUST come first.
    # gns3-dev/outfiles is deliberately absent: it holds stale exports that share their
    # project_id with the rebuilt originals under activities/, so importing one shadows
    # the other. gns3build.py warns (DUP) if a name resolves under more than one root.
    project_roots:
      - "{{ gns3_dev_repo }}/activities"
      - "{{ extra_project_dir }}"

    # Verification gate: none | smoke | all.
    #   smoke - a few fast activities spanning docker + qemu + the custom images
    #   all   - every activity with a test manifest; slow (tens of minutes), and what
    #           you want before exporting an OVA
    verify: smoke
    verify_smoke_activities: [ping-basics, stp-basics, ospf-basics, port-scanning]

    gns3build: "{{ vm_repo_dir }}/server/build/gns3build.py"

    # The projects phase runs on the control node, so its record of each source file's
    # size + sha256 lands here and is copied to the VM for `provenance` to fold in. Git
    # cannot hold the oversized projects, so this is the only durable statement of which
    # bytes the appliance was built from.
    import_record_local: "{{ playbook_dir }}/.gns3build-imports.json"
    import_record_remote: /home/gns3/.gns3build-imports.json
    provenance_path: /home/gns3/gns3-build-provenance.json

    # Ansible shows nothing while a task runs, and the build phase is half an hour of
    # docker builds. Tee the two long, silent phases to logs you can tail. Stable paths,
    # truncated per run, so the tail command never changes (use `tail -F`).
    build_log: /home/gns3/gns3build.log
    verify_log: "{{ playbook_dir }}/gns3build-verify.log"

    # Resolved via hostvars, not bare ansible_host: inside a `delegate_to: localhost`
    # task ansible_host refers to the *delegation target*, so the bare form silently
    # becomes "localhost" in exactly the tasks that need the VM's address.
    vm_address: "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"
    api_url: "http://{{ vm_address }}"

  tasks:
    - name: Check that a profile was given
      ansible.builtin.assert:
        that: profile is defined and profile | length > 0
        fail_msg: >-
          Set the profile, e.g. -e profile=pc-student
          (one of pc-student, pc-staff, mac-student, mac-staff)
        quiet: true

    # check_mode: false on the read-only tasks — they must really run even in a dry run,
    # or everything downstream has nothing to work from. The tasks that *change* things
    # get gns3build.py's own --dry-run instead of being skipped, so `--check` reports
    # what the build would actually do rather than a blank.
    - name: Check the GNS3 controller API is up
      ansible.builtin.uri:
        url: "{{ api_url }}/v2/version"
        return_content: true
      register: gns3_version
      delegate_to: localhost
      check_mode: false
      retries: 5
      delay: 3
      until: gns3_version is succeeded

    - name: Report what we are building
      ansible.builtin.debug:
        msg:
          - "profile={{ profile }} vm={{ api_url }}
             gns3={{ (gns3_version.content | from_json).version }} verify={{ verify }}"
          - "The build phase is long and ansible prints nothing while it runs. Watch it:"
          - "  ssh {{ ansible_user }}@{{ vm_address }} 'tail -F {{ build_log }}'"
          - "  tail -F {{ verify_log }}    # once it reaches verification"

    # ---------------------------------------------------------------- sync ----
    # Sync only what the engine needs: the build tooling, docker contexts, templates and
    # start-vnc.sh (server/), plus the node logos (images/symbols).
    #
    # No `mode:` below on purpose — rsync -a restores the source tree's permissions, so
    # forcing a mode here just makes this task and the rsync flip-flop each other, and
    # both then report "changed" forever on an otherwise unchanged system.
    - name: Create the repo directories on the VM
      ansible.builtin.file:
        path: "{{ vm_repo_dir }}/{{ item }}"
        state: directory
      loop: [server, images]

    # Work out how rsync should authenticate. Do NOT assume "a password was supplied"
    # means "use sshpass": build.sh always supplies one, but most build hosts already
    # have a working key for the VM, and then sshpass is an unnecessary dependency whose
    # absence fails deep inside rsync with a confusing "Failed to exec sshpass". Probe
    # the same way ansible itself just connected, and only reach for sshpass if keys
    # genuinely do not work.
    - name: Check whether key-based ssh to the VM already works
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=no
          - -o
          - UserKnownHostsFile=/dev/null
          - -o
          - ConnectTimeout=10
          - "{{ ansible_user }}@{{ vm_address }}"
          - "true"
      register: ssh_key_probe
      changed_when: false
      failed_when: false
      delegate_to: localhost
      check_mode: false

    - name: Look for sshpass on the control node
      ansible.builtin.shell: command -v sshpass
      register: sshpass_check
      changed_when: false
      failed_when: false
      delegate_to: localhost
      check_mode: false

    # Without a key this stops the run now rather than an hour in: the same gap would also
    # break verification, where gns3_autotest.py needs the VM's shell to configure
    # shell-less Open vSwitch nodes. It makes the same key-first decision this play does.
    - name: Require sshpass when there is no usable key
      ansible.builtin.assert:
        that: sshpass_check.rc == 0
        fail_msg: >-
          Key-based ssh to {{ ansible_user }}@{{ vm_address }} does not work, so rsync and
          the Open vSwitch activities would both need sshpass for the password login — but
          sshpass is not installed. Either install it (apt install sshpass, or brew install
          hudochenkov/sshpass/sshpass) or, better, give the VM your key:
          ssh-copy-id {{ ansible_user }}@{{ vm_address }}
        quiet: true
      when: ssh_key_probe.rc != 0

    - name: Build the rsync remote-shell command
      ansible.builtin.set_fact:
        # sshpass -e reads the password from $SSHPASS, so it never appears in ps output.
        rsync_rsh: >-
          {{ 'sshpass -e ' if use_password else '' }}ssh
          -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
          {{ '-i ' + ansible_ssh_private_key_file if ansible_ssh_private_key_file is defined else '' }}
        rsync_auth: "{{ 'password (sshpass)' if use_password else 'ssh key' }}"
      vars:
        use_password: "{{ ssh_key_probe.rc != 0 and ansible_password is defined }}"

    - name: Report how the sync will authenticate
      ansible.builtin.debug:
        msg: "rsync to the VM will authenticate with {{ rsync_auth }}"

    # Plain rsync rather than ansible.posix.synchronize: that module lives in a collection
    # ansible-core does not ship, and it does not carry ansible_password through to rsync's
    # ssh — which is the default auth for a stock GNS3 VM. Doing it directly keeps this
    # playbook working on a bare ansible-core with either auth mode.
    - name: Sync the gns3 repo to the VM
      # argv as a list expression so --dry-run can be added conditionally. Nothing else
      # may be added to stdout: changed_when reads rsync's --itemize-changes output, and
      # anything extra (e.g. --stats) would make it look permanently changed.
      ansible.builtin.command:
        argv: >-
          {{ ['rsync', '--archive', '--delete', '--itemize-changes']
             + (['--dry-run'] if ansible_check_mode else [])
             + ['--exclude=.git', '--exclude=__pycache__', '--exclude=*.pyc',
                '--exclude=ansible',
                '--rsh=' ~ rsync_rsh,
                item.src,
                ansible_user ~ '@' ~ vm_address ~ ':' ~ item.dest] }}
      environment:
        SSHPASS: "{{ ansible_password | default('') }}"
      register: gns3_sync
      changed_when: gns3_sync.stdout | trim | length > 0
      delegate_to: localhost
      check_mode: false
      loop:
        - {src: "{{ gns3_repo }}/server/", dest: "{{ vm_repo_dir }}/server/"}
        - {src: "{{ gns3_repo }}/images/", dest: "{{ vm_repo_dir }}/images/"}
      loop_control:
        label: "{{ item.dest }}"

    - name: Make gns3build.py executable
      ansible.builtin.file:
        path: "{{ gns3build }}"
        mode: "0755"

    - name: Validate the manifest before building
      ansible.builtin.command: "{{ gns3build }} validate"
      register: gns3_validate
      changed_when: false
      check_mode: false

    # --------------------------------------------------------------- build ----
    # Everything except projects runs on the VM: docker builds must happen on the
    # target architecture, and qemu/logos/novnc touch its filesystem.
    # `set -o pipefail` is load-bearing: without it the task's exit status is tee's, which
    # is always 0, and a failed build would be reported as a success. bash because the
    # VM's /bin/sh is dash, which has no pipefail.
    - name: Run the build phases on the VM
      ansible.builtin.shell: >-
        set -o pipefail &&
        {{ gns3build }} build --profile {{ profile }} --skip projects
        --server http://localhost {{ '--dry-run' if ansible_check_mode else '' }}
        2>&1 | tee {{ build_log }}
      args:
        executable: /bin/bash
      register: gns3_build
      check_mode: false
      changed_when: >-
        'built 0,' not in gns3_build.stdout or
        'installed 0,' not in gns3_build.stdout or
        'copied 0,' not in gns3_build.stdout or
        'registered 0,' not in gns3_build.stdout
      failed_when: gns3_build.rc != 0

    - name: Show the build summary
      ansible.builtin.debug:
        msg: "{{ gns3_build.stdout_lines[-8:] }}"

    # ------------------------------------------------------------ projects ----
    # From the control node, straight into the VM's API — see the header note.
    - name: Import the projects from the control node
      ansible.builtin.command: >-
        {{ gns3_repo }}/server/build/gns3build.py projects
        --profile {{ profile }}
        --server {{ api_url }}
        --roots {{ project_roots | join(',') }}
        --record {{ import_record_local }}
        {{ '--dry-run' if ansible_check_mode else '' }}
      register: gns3_projects
      delegate_to: localhost
      check_mode: false
      changed_when: "'imported 0,' not in gns3_projects.stdout"

    - name: Show the project import summary
      ansible.builtin.debug:
        msg: "{{ gns3_projects.stdout_lines[-6:] }}"

    - name: Warn if a project resolved under more than one root
      ansible.builtin.debug:
        msg: >-
          Duplicate project files were found — check the DUP lines above and the order of
          project_roots. A stale copy sharing a project_id will shadow the good one.
      when: "'WARN' in gns3_projects.stdout"

    # -------------------------------------------------------------- verify ----
    # failed_when: false so every activity runs even after one goes red — a pre-export
    # gate should report the whole list of what is broken, not just the first thing.
    # The assert below is the gate.
    - name: Start a fresh verification log
      ansible.builtin.copy:
        content: "verification of {{ profile }} on {{ api_url }} — {{ verify }}\n"
        dest: "{{ verify_log }}"
        mode: "0644"
      delegate_to: localhost
      changed_when: false
      when: verify != 'none' and not ansible_check_mode

    # pipefail again — see the build phase. Without it every activity would report rc=0
    # and the gate below would pass whatever happened.
    #
    # python3 -u: piping to tee makes python block-buffer stdout, so with `verify=all`
    # (one process for the whole matrix) the log sits empty for hours and looks hung
    # regardless of how the run is actually going. Unbuffered, it reports per activity.
    - name: Verify the appliance with gns3_autotest.py
      ansible.builtin.shell: >-
        set -o pipefail &&
        python3 -u {{ gns3_dev_repo }}/tools/gns3_autotest.py
        {{ '--all' if verify == 'all' else item }}
        --server {{ api_url }} 2>&1 | tee -a {{ verify_log }}
      args:
        executable: /bin/bash
      register: gns3_verify
      delegate_to: localhost
      changed_when: false
      failed_when: false
      loop: "{{ [''] if verify == 'all' else verify_smoke_activities }}"
      loop_control:
        label: "{{ 'all activities' if verify == 'all' else item }}"
      when: verify != 'none' and not ansible_check_mode

    - name: Verification results
      ansible.builtin.debug:
        msg: >-
          {{ 'PASS' if (item.rc == 0 and 'FAIL' not in item.stdout) else 'FAIL' }}
          {{ item.item | default('all') or 'all activities' }}
          {{ '— ' + (item.stderr_lines | last) if item.rc != 0 and item.stderr_lines else '' }}
      loop: "{{ gns3_verify.results | default([]) }}"
      loop_control:
        label: "{{ item.item | default('all') or 'all' }}"
      when: verify != 'none' and not ansible_check_mode

    - name: Fail the build if verification went red
      ansible.builtin.assert:
        that: item.rc == 0 and 'FAIL' not in item.stdout
        fail_msg: >-
          verification failed for '{{ item.item | default('all') or 'all activities' }}'
          (rc={{ item.rc }}) — the appliance is NOT fit to export
        quiet: true
      loop: "{{ gns3_verify.results | default([]) }}"
      loop_control:
        label: "{{ item.item | default('all') or 'all' }}"
      when: verify != 'none' and not ansible_check_mode

    # ------------------------------------------------- pre-export gate + record ----
    # A student OVA must not carry staff solutions, and a stray .gns3project staged on
    # the VM ships inside the image even though nothing imports it. Fail here rather than
    # after the OVA is built and handed out.
    - name: Check nothing outside this audience would ship
      ansible.builtin.command: "{{ gns3build }} export-check --profile {{ profile }}"
      register: gns3_export_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Report the export check
      ansible.builtin.debug:
        msg: "{{ gns3_export_check.stdout_lines }}"

    - name: Fail if the appliance would leak another audience's projects
      ansible.builtin.assert:
        that: gns3_export_check.rc == 0
        fail_msg: >-
          export-check found content that must not ship as '{{ profile }}' — see the LEAK
          lines above. Do NOT export this VM until they are removed.
        quiet: true

    - name: Copy the source-checksum record to the VM
      ansible.builtin.copy:
        src: "{{ import_record_local }}"
        dest: "{{ import_record_remote }}"
        mode: "0644"
      when: not ansible_check_mode

    - name: Record what this appliance contains
      ansible.builtin.command: >-
        {{ gns3build }} provenance --profile {{ profile }}
        --imports {{ import_record_remote }} --out {{ provenance_path }}
      register: gns3_provenance
      changed_when: not ansible_check_mode
      failed_when: false
      check_mode: false

    - name: Report the provenance manifest
      ansible.builtin.debug:
        msg: "{{ gns3_provenance.stdout_lines }}"

    - name: Fetch the provenance manifest next to the build
      ansible.builtin.fetch:
        src: "{{ provenance_path }}"
        dest: "{{ playbook_dir }}/provenance-{{ profile }}.json"
        flat: true
      when: not ansible_check_mode

    - name: Build complete
      ansible.builtin.debug:
        msg: >-
          {{ 'DRY RUN — nothing was changed. ' if ansible_check_mode else '' }}
          {{ profile }} {{ 'would be built' if ansible_check_mode else 'built' }}
          on {{ api_url }} — verification:
          {{ 'skipped in check mode' if ansible_check_mode
             else ('skipped' if verify == 'none' else verify + ' PASSED') }}.
          {{ '' if ansible_check_mode else
             'export-check OK; provenance in ' + provenance_path + ' (copy fetched to '
             + playbook_dir + '/provenance-' + profile + '.json). Next: shut the VM down,'
             + ' snapshot it, then export the OVA — see ansible/README.md.' }}
