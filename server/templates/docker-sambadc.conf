    "template_type": "docker",
    "name": "Domain Controller",
    "usage": "Samba as an Active Directory Domain Controller — Kerberos, LDAP and DNS as one domain. The image ships NO domain: create one with samba-tool domain provision --use-rfc2307 --realm=AD.EXAMPLE.COM --domain=AD --server-role=dc --dns-backend=SAMBA_INTERNAL --host-name=DC --adminpass='...' (set the hostname and address first — provisioning reads them). Then start it with: start-samba-dc.sh (run this again every time you reopen the project). Manage the domain with samba-tool user/group; read it with ldapsearch. This node is the DNS server for its domain, so every client must point resolv.conf at this node's address or nothing will find the domain. Check what it is doing with: samba-dc-status.sh",
