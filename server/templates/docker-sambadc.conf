    "image": "cqugns3/sambadc:latest",
    "template_type": "docker",
    "name": "Domain Controller",
    "usage": "Samba as an Active Directory Domain Controller \u2014 Kerberos, LDAP and DNS as one domain. The image ships NO domain. Set the hostname and the eth0 address FIRST (Samba binds its listeners at startup, so a DC started before the interface is addressed serves nothing), then create the domain: samba-tool domain provision --use-rfc2307 --realm=AD.EXAMPLE.COM --domain=AD --server-role=dc --dns-backend=SAMBA_INTERNAL --host-name=DC --adminpass='...'. Start it with: start-samba-dc.sh (run this again every time you reopen the project, after re-addressing eth0; add --restart if it is already running but was started too early). Create users WITH POSIX attributes or a Linux client cannot use them: samba-tool user create alice 'pw' --nis-domain=ad --unix-home=/home/alice --uid-number=11001 --gid-number=11000 --login-shell=/bin/bash. This node is the DNS server for its domain, so every client must point resolv.conf at it. Check what it is doing with: samba-dc-status.sh",
    "mac_address": "",
    "start_command": "",
    "environment": "",
    "console_type": "telnet",
    "console_auto_start": false,
    "console_http_port": 80,
    "console_http_path": "/",
    "console_resolution": "1024x768",
    "extra_hosts": "",
    "extra_volumes": [
        "/etc/samba",
        "/var/lib/samba",
        "/root",
        "/usr/local/bin"
    ],
    "custom_adapters": [],
    "default_name_format": "DC{0}"
