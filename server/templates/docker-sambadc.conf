    "console_http_port": 80,
    "console_http_path": "/",
    "console_resolution": "1024x768",
    "extra_hosts": "",
    "extra_volumes": ["/etc/samba", "/var/lib/samba", "/root", "/usr/local/bin"],
    "custom_adapters": [],
    "default_name_format": "DC{0}"
