    "name": "Patch Server",
    "usage": "The estate's package source — a local Ubuntu-style apt repository, served offline with no Internet needed. Start with: start-patchrepo.sh (it must be run again each time the project is opened). It offers three suites: cqu-base (the versions an estate was installed with), cqu-security (a security update, fixing a CVE) and cqu-updates (a feature update and a breaking vendor update). A client adds it with a line in /etc/apt/sources.list.d/, e.g. deb [trusted=yes] http://<this-node-ip>/ cqu-base main — then apt-get update and apt-get install cqu-payroll cqu-webapp cqu-legacy-agent. Adding the cqu-security and cqu-updates lines is what makes updates appear in apt list --upgradable. The repository is baked into the image at /opt/cqu-repo and cannot be damaged from a client.",
