            "usage": "The lab end of a tunnel to a cloud VM - the same alpinenode as the VPN Router, pre-shaped for the job. eth0 faces your lab LAN; eth1 goes to a GNS3 NAT node and gets its address by DHCP. This node ALWAYS dials out and is never dialled: several NATs sit between it and the Internet, so the cloud end holds the public address, listens, and learns where you are from your first handshake. Give its peer an Endpoint and a PersistentKeepalive; the far end gets neither. UNLIKE EVERY OTHER NODE, THIS ONE KEEPS NO SHELL HISTORY (HISTFILE=/dev/null), because it is the node cloud credentials are typed on and /root ships inside an exported project. Put a token in a file under /tmp, source it, and delete it - /tmp is not kept. Never type a private key: generate it here with wg genkey.",
