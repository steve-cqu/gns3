    "usage": "A wired access switch with 802.1X port control: each access port stays shut until a user on it logs in, then opens in the VLAN the RADIUS server gives that user. eth0 is the management port (give it an address; it talks RADIUS), eth1-eth4 are access ports, eth5 is the trunk carrying VLANs 10, 20, 50 and 99 tagged. Settings (RADIUS server, shared secret, ports, VLANs) are in /etc/nac/switch.conf. Start with: start-8021x-switch.sh. See every port's state with: 8021x-status.sh. The RADIUS server must list this switch in its clients.conf as client sw1. A PC logs in with wpa_supplicant -D wired on a Linux Host.",
