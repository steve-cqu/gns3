    "name": "Access Point",
    "usage": "Wi-Fi access point (hostapd, WPA2-PSK). IMPORTANT: a wireless node has no radio until you attach one. After you Start the project, on the GNS3 VM host run once: gns3-wifi-attach <project-name> — that moves a simulated radio into every wireless node (it then appears as wlan0). Then on this node run: start-ap.sh (it beacons SSID 'cqu-lab' on channel 6 with WPA2-PSK, and gives wlan0 the address 10.0.0.1). Edit /etc/hostapd/hostapd.conf to change the SSID, channel or passphrase. Watch associated clients with: wifi-status.sh. Capture the four-way handshake with: start-monitor.sh then tcpdump on mon0 (the one activity where an on-node capture is correct — wireless frames are not on a GNS3 link).",
