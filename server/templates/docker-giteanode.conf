    "console_type": "telnet",
    "console_auto_start": false,
    "console_http_port": 3000,
    "console_http_path": "/",
    "console_resolution": "1024x768",
    "extra_hosts": "",
    "extra_volumes": ["/etc", "/root", "/usr/local/bin", "/var/lib/gitea"],
    "custom_adapters": [],
    "default_name_format": "Git{0}"
