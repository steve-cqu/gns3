    "image": "cqugns3/giteanode:latest",
    "template_type": "docker",
    "name": "Git Server",
    "usage": "Gitea — a self-hosted Git server with a web UI (a small GitHub/GitLab). Start with: start-gitea.sh (it initialises a SQLite database and an admin account on first run, then serves on port 3000). Open the web UI in a browser (a Firefox Host) at http://<this-node-ip>:3000/ and sign in as gitadmin / labpass123. Create a repository in the web UI, then from a Linux Host clone it over HTTP: git clone http://gitadmin:labpass123@<this-node-ip>:3000/gitadmin/<repo>.git — commit and push, and refresh the web UI to see it. Git access is over HTTP (no SSH keys); the database and repositories persist in /var/lib/gitea. Check what it is doing with: gitea-status.sh",
