    "name": "NTP Server",
    "usage": "chrony NTP server, serving at stratum 8 so it works with no upstream time source. Start with: start-ntp.sh — check it with ntp-status.sh, and see who is asking with chronyc clients. NOTE: every container node shares the GNS3 VM's clock, so a client cannot be made to show a different time. A client MEASURES the offset instead (chronyd -Q 'server <ip> iburst'), and a skewed clock is simulated per-process with faketime. Config in /etc/chrony/chrony.conf explains this.",
