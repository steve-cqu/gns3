    "name": "Flow Collector",
    "usage": "NetFlow collector (nfcapd + nfdump). Flows are the third way to see a network, beside packet capture and IDS signatures: who talked to whom, how much, when. Start the collector with: start-flow.sh (listens on UDP 9995). On a router or host, export flows to it with: start-flowprobe.sh <interface> <this-node-ip>. After about a minute, see the top talkers and conversations with: flow-status.sh, or query directly: nfdump -R /var/flows -s ip/bytes. Captured flows persist in /var/flows.",
