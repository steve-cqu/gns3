    "usage": "A RADIUS client: the network device that asks a RADIUS server whether to let a user in. In a real network this is a switch, a Wi-Fi access point or a VPN gateway; here it is a test device carrying the tools those devices use. RADIUS calls it a Network Access Server (NAS), which is why requests carry NAS-IP-Address (nothing to do with network-attached storage). Ask the server with: radtest <user> <password> <server> 0 <shared secret>, for example radtest ritesh staffpass 192.168.1.10 0 labsecret. Send your own attributes with radclient (an accounting Start, for example). Test an EAP login (PEAP, TTLS, EAP-TLS) with eapol_test -c <config> -a <server> -s <shared secret>; eapol_test plays both the user's device and the switch, so copy the server's /etc/raddb/certs/ca.pem here first if the config validates the server. The server must list this device's address in its clients.conf.",
