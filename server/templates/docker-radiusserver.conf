    "name": "RADIUS Server",
    "usage": "FreeRADIUS 3.0 server: the AAA server behind wired 802.1X and WPA2-Enterprise. Start with: start-radius.sh (it runs radiusd -C first, so a bad config is reported rather than silently ignored); start-radius.sh -X runs it in the foreground in debug mode, which shows every request and why it was accepted or rejected. It ships with a lab client for 192.168.1.0/24 (shared secret labsecret) in /etc/raddb/clients.conf, three users with VLANs (sam/staffpass VLAN 10, riley/studentpass VLAN 20, visitor/guestpass VLAN 50) in /etc/raddb/users, and a lab CA and server certificate (/etc/raddb/certs/ca.pem is the CA to copy to clients). Test with: radtest sam staffpass <server> 0 labsecret, or eapol_test for PEAP, TTLS and EAP-TLS. See what it is doing with: radius-status.sh",
    "mac_address": "",
    "start_command": "",
    "environment": "",
    "console_type": "telnet",
    "console_auto_start": false,
    "console_http_port": 80,
    "console_http_path": "/",
    "console_resolution": "1024x768",
    "extra_hosts": "",
    "extra_volumes": ["/etc", "/root", "/usr/local/bin", "/var/log/radius"],
    "custom_adapters": [],
    "default_name_format": "RADIUS{0}"
