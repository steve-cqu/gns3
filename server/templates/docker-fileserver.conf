    "name": "File Server",
    "usage": "Samba (SMB/CIFS) file server — the protocol behind Windows shared folders and mapped network drives. Start with: start-fileserver.sh. It shares two folders: \\\\<this-node-ip>\\public (anyone, read/write) and \\\\<this-node-ip>\\private (user 'student', password 'gns3'). From a Linux Host client, list shares with: smbclient -L //<this-node-ip> -N ; copy files with: smbclient //<this-node-ip>/public -N ; or mount it as a folder with: mount -t cifs //<this-node-ip>/public /mnt -o guest (mount needs the cifs kernel module on the VM host). Edit /etc/samba/smb.conf to change the shares or access; the shared files persist in /srv. See who is connected with: fileshare-status.sh",
